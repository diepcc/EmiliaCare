<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FonoApp - Controle de Consultas</title>
  
  <!-- Suporte a PWA no iOS Safari -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="FonoApp">
  <link rel="manifest" href="manifest.json">

  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Supabase JS Client via CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans pb-10">

  <!-- Cabeçalho -->
  <header class="bg-teal-700 text-white p-4 shadow-md sticky top-0 z-10 flex justify-between items-center">
    <h1 class="text-xl font-bold tracking-wide">🗣️ FonoApp</h1>
    <span id="status-conexao" class="text-xs bg-teal-800 px-2 py-1 rounded">Pronto</span>
  </header>

  <!-- Navegação por Abas -->
  <nav class="flex bg-white border-b border-gray-200">
    <button onclick="mudarAba('atendimento')" id="tab-atendimento" class="flex-1 py-3 text-center font-medium border-b-2 border-teal-600 text-teal-600">Atendimento</button>
    <button onclick="mudarAba('pacientes')" id="tab-pacientes" class="flex-1 py-3 text-center font-medium text-gray-500 border-b-2 border-transparent">Pacientes</button>
    <button onclick="mudarAba('relatorios')" id="tab-relatorios" class="flex-1 py-3 text-center font-medium text-gray-500 border-b-2 border-transparent">Relatórios</button>
  </nav>

  <main class="max-w-md mx-auto p-4">

    <!-- ABA 1: ATENDIMENTO / GRAVAÇÃO -->
    <section id="sec-atendimento" class="space-y-6">
      <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-100">
        <label class="block text-sm font-semibold mb-2">1. Selecione o Paciente</label>
        <select id="select-paciente" class="w-full p-3 border rounded-lg bg-gray-50 text-base">
          <option value="">Carregando pacientes...</option>
        </select>

        <button onclick="iniciarAtendimento()" id="btn-iniciar" class="w-full mt-4 bg-teal-600 text-white font-semibold p-3 rounded-lg shadow hover:bg-teal-700 transition">
          ▶️ Iniciar Atendimento
        </button>
      </div>

      <!-- Painel de Gravador (Oculto no início) -->
      <div id="painel-gravacao" class="hidden bg-white p-5 rounded-xl shadow-sm border border-gray-100 text-center space-y-4">
        <div class="inline-block bg-red-100 text-red-600 px-3 py-1 rounded-full text-xs font-semibold animate-pulse">
          🔴 Em Atendimento
        </div>
        
        <div id="cronometro" class="text-4xl font-mono font-bold text-gray-700">00:00</div>

        <div class="flex justify-center gap-3">
          <button id="btn-gravar" onclick="alternarGravacao()" class="bg-red-500 text-white font-semibold px-5 py-3 rounded-lg shadow hover:bg-red-600 flex items-center gap-2">
            🎙️ Gravar Evolução
          </button>
        </div>

        <p id="status-audio" class="text-xs text-gray-500 italic">Clique em "Gravar Evolução" para narrar o atendimento.</p>

        <hr class="my-4">

        <button onclick="finalizarAtendimento()" id="btn-salvar" class="w-full bg-emerald-600 text-white font-semibold p-3 rounded-lg shadow hover:bg-emerald-700 disabled:opacity-50" disabled>
          💾 Finalizar e Processar IA
        </button>
      </div>

      <!-- Exibição do Resultado Gerado -->
      <div id="resultado-gerado" class="hidden space-y-4">
        <div class="bg-white p-4 rounded-xl border border-gray-200">
          <h3 class="font-bold text-teal-800 text-sm mb-1">👨‍👩‍👦 Relatório da Família</h3>
          <p id="txt-familia" class="text-sm text-gray-600 whitespace-pre-line"></p>
          <button onclick="compartilharWhatsApp()" class="mt-3 w-full bg-green-500 text-white text-xs font-bold py-2 rounded flex items-center justify-center gap-2">
            📲 Enviar no WhatsApp
          </button>
        </div>

        <div class="bg-white p-4 rounded-xl border border-gray-200">
          <h3 class="font-bold text-gray-800 text-sm mb-1">📋 Evolução Técnica (Prontuário/Unimed)</h3>
          <p id="txt-tecnico" class="text-sm text-gray-600 whitespace-pre-line"></p>
        </div>
      </div>
    </section>

    <!-- ABA 2: CADASTRO DE PACIENTES -->
    <section id="sec-pacientes" class="hidden space-y-4">
      <form id="form-paciente" onsubmit="salvarPaciente(event)" class="bg-white p-5 rounded-xl shadow-sm border border-gray-100 space-y-3">
        <h3 class="font-bold text-lg text-gray-700">Novo Paciente</h3>
        <input type="text" id="p-nome" placeholder="Nome Completo *" required class="w-full p-2 border rounded text-sm">
        <div class="grid grid-cols-2 gap-2">
          <input type="text" id="p-cpf" placeholder="CPF" class="p-2 border rounded text-sm">
          <input type="text" id="p-unimed" placeholder="Carteira Unimed" class="p-2 border rounded text-sm">
        </div>
        <input type="text" id="p-tel" placeholder="Telefone do Responsável" class="w-full p-2 border rounded text-sm">
        <button type="submit" class="w-full bg-teal-600 text-white font-semibold py-2 rounded text-sm">Cadastrar</button>
      </form>

      <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-100">
        <h4 class="font-bold text-sm mb-2 text-gray-600">Pacientes Cadastrados</h4>
        <ul id="lista-pacientes" class="divide-y text-sm"></ul>
      </div>
    </section>

    <!-- ABA 3: RELATÓRIOS MENSAL UNIMED -->
    <section id="sec-relatorios" class="hidden space-y-4">
      <div class="bg-white p-5 rounded-xl shadow-sm border border-gray-100 space-y-3">
        <h3 class="font-bold text-gray-700">Consolidado Mensal</h3>
        <select id="rel-paciente" class="w-full p-2 border rounded text-sm"></select>
        <button onclick="gerarRelatorioMensal()" class="w-full bg-teal-600 text-white font-semibold py-2 rounded text-sm">Gerar Relatório</button>
      </div>

      <div id="tabela-relatorio" class="hidden bg-white p-4 rounded-xl border space-y-3">
        <div id="conteudo-impressao" class="text-xs space-y-2"></div>
        <button onclick="window.print()" class="w-full bg-gray-700 text-white text-xs py-2 rounded">🖨️ Imprimir / Salvar PDF</button>
      </div>
    </section>

  </main>

  <!-- SCRIPTS DA APLICAÇÃO -->
  <script>
    // -------------------------------------------------------------
    // CONFIGURAÇÕES DAS APIS (Substitua pelos seus dados)
    // -------------------------------------------------------------
    const SUPABASE_URL = "https://SEU-PROJETO.supabase.co";
    const SUPABASE_KEY = "SUA-CHAVE-ANON-SUPABASE";
    const GROQ_API_KEY = "SUA-CHAVE-GROQ-CLOUD";

    const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // Variáveis Globais de Estado
    let mediaRecorder, audioChunks = [], blobAudioFinal = null;
    let consultaAtualId = null, tempoInicio = null, timerInterval = null;

    // Inicialização
    document.addEventListener("DOMContentLoaded", () => {
      carregarPacientes();
    });

    // -------------------------------------------------------------
    // GERENCIAMENTO DE ABAS
    // -------------------------------------------------------------
    function mudarAba(aba) {
      ['atendimento', 'pacientes', 'relatorios'].forEach(a => {
        document.getElementById(`sec-${a}`).classList.add('hidden');
        document.getElementById(`tab-${a}`).className = "flex-1 py-3 text-center font-medium text-gray-500 border-b-2 border-transparent";
      });
      document.getElementById(`sec-${aba}`).classList.remove('hidden');
      document.getElementById(`tab-${aba}`).className = "flex-1 py-3 text-center font-medium border-b-2 border-teal-600 text-teal-600";
    }

    // -------------------------------------------------------------
    // LÓGICA DE ATENDIMENTO E CRONÔMETRO
    // -------------------------------------------------------------
    async function iniciarAtendimento() {
      const pacienteId = document.getElementById("select-paciente").value;
      if (!pacienteId) return alert("Selecione um paciente!");

      const { data, error } = await db.from('consultas').insert([
        { paciente_id: pacienteId, horario_inicio: new Date().toISOString() }
      ]).select().single();

      if (error) return alert("Erro ao iniciar consulta: " + error.message);

      consultaAtualId = data.id;
      document.getElementById("painel-gravacao").classList.remove("hidden");
      document.getElementById("btn-iniciar").classList.add("hidden");

      // Inicia cronômetro
      tempoInicio = Date.now();
      timerInterval = setInterval(() => {
        const seg = Math.floor((Date.now() - tempoInicio) / 1000);
        const m = String(Math.floor(seg / 60)).padStart(2, '0');
        const s = String(seg % 60).padStart(2, '0');
        document.getElementById("cronometro").innerText = `${m}:${s}`;
      }, 1000);
    }

    // -------------------------------------------------------------
    // GRAVAÇÃO DE ÁUDIO (COMPATÍVEL COM IOS/SAFARI)
    // -------------------------------------------------------------
    async function alternarGravacao() {
      const btn = document.getElementById("btn-gravar");

      if (!mediaRecorder || mediaRecorder.state === "inactive") {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
        
        // MimeType compatível com iOS Safari
        const options = MediaRecorder.isTypeSupported('audio/mp4') ? { mimeType: 'audio/mp4' } : {};
        mediaRecorder = new MediaRecorder(stream, options);
        audioChunks = [];

        mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
        mediaRecorder.onstop = () => {
          blobAudioFinal = new Blob(audioChunks, { type: mediaRecorder.mimeType });
          document.getElementById("btn-salvar").disabled = false;
          document.getElementById("status-audio").innerText = "Áudio gravado com sucesso!";
        };

        mediaRecorder.start();
        btn.innerText = "⏹️ Parar Gravação";
        btn.classList.replace("bg-red-500", "bg-gray-700");
      } else {
        mediaRecorder.stop();
        btn.innerText = "🎙️️ Re-gravar";
        btn.classList.replace("bg-gray-700", "bg-red-500");
      }
    }

    // -------------------------------------------------------------
    // TRANSCRIÇÃO & PROCESSAMENTO IA (GROQ API)
    // -------------------------------------------------------------
    async function finalizarAtendimento() {
      if (!blobAudioFinal) return alert("Grave o áudio da evolução antes de finalizar.");

      clearInterval(timerInterval);
      document.getElementById("status-audio").innerText = "Processando áudio e gerando relatórios...";

      try {
        // 1. Transcrever via Whisper na Groq Cloud
        const formData = new FormData();
        formData.append("file", blobAudioFinal, "audio.mp4");
        formData.append("model", "whisper-large-v3");
        formData.append("language", "pt");

        const resWhisper = await fetch("https://api.groq.com/openai/v1/audio/transcriptions", {
          method: "POST",
          headers: { "Authorization": `Bearer ${GROQ_API_KEY}` },
          body: formData
        });
        const dataWhisper = await resWhisper.json();
        const textoBruto = dataWhisper.text;

        // 2. Formatar Evolução e Relatório via Llama 3.3
        const promptSystem = `Você é um assistente fonoaudiológico. Receba o áudio transcrito e retorne ESTRITAMENTE um JSON com as chaves:
        "evolucao_tecnica": (Evolução clínica formal, corrigida e estruturada em Tópicos para prontuário/Unimed)
        "relatorio_familia": (Resumo acolhedor e simples em linguagem leiga para enviar no WhatsApp aos pais)`;

        const resLLM = await fetch("https://api.groq.com/openai/v1/chat/completions", {
          method: "POST",
          headers: {
            "Authorization": `Bearer ${GROQ_API_KEY}`,
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            model: "llama-3.3-70b-versatile",
            messages: [
              { role: "system", content: promptSystem },
              { role: "user", content: textoBruto }
            ],
            response_format: { type: "json_object" }
          })
        });

        const dataLLM = await resLLM.json();
        const resultado = JSON.parse(dataLLM.choices[0].message.content);

        // 3. Atualizar no Supabase
        const horarioFim = new Date().toISOString();
        const duracaoMin = Math.round((Date.now() - tempoInicio) / 60000);

        await db.from('consultas').update({
          horario_fim: horarioFim,
          duracao_minutos: duracaoMin,
          transcricao_bruta: textoBruto,
          evolucao_tecnica: resultado.evolucao_tecnica,
          relatorio_familia: resultado.relatorio_familia
        }).eq('id', consultaAtualId);

        // Exibir na Tela
        document.getElementById("txt-familia").innerText = resultado.relatorio_familia;
        document.getElementById("txt-tecnico").innerText = resultado.evolucao_tecnica;
        document.getElementById("resultado-gerado").classList.remove("hidden");
        document.getElementById("painel-gravacao").classList.add("hidden");

      } catch (err) {
        alert("Erro ao processar: " + err.message);
      }
    }

    // -------------------------------------------------------------
    // CADASTRO DE PACIENTES
    // -------------------------------------------------------------
    async function salvarPaciente(e) {
      e.preventDefault();
      const novo = {
        nome: document.getElementById("p-nome").value,
        cpf: document.getElementById("p-cpf").value,
        carteira_unimed: document.getElementById("p-unimed").value,
        telefone_responsavel: document.getElementById("p-tel").value
      };

      const { error } = await db.from('pacientes').insert([novo]);
      if (error) alert("Erro ao salvar: " + error.message);
      else {
        document.getElementById("form-paciente").reset();
        carregarPacientes();
      }
    }

    async function carregarPacientes() {
      const { data } = await db.from('pacientes').select('*').order('nome');
      
      const select = document.getElementById("select-paciente");
      const selectRel = document.getElementById("rel-paciente");
      const lista = document.getElementById("lista-pacientes");

      select.innerHTML = '<option value="">Selecione...</option>';
      selectRel.innerHTML = '<option value="">Selecione...</option>';
      lista.innerHTML = '';

      if (data) {
        data.forEach(p => {
          select.innerHTML += `<option value="${p.id}">${p.nome}</option>`;
          selectRel.innerHTML += `<option value="${p.id}">${p.nome}</option>`;
          lista.innerHTML += `<li class="py-2">${p.nome} <span class="text-xs text-gray-400">(${p.carteira_unimed || 'Sem carteira'})</span></li>`;
        });
      }
    }

    function compartilharWhatsApp() {
      const texto = encodeURIComponent(document.getElementById("txt-familia").innerText);
      window.open(`https://wa.me/?text=${texto}`, '_blank');
    }
  </script>
</body>
</html>
